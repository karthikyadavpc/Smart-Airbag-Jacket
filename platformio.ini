[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; Compile-check the optional SMS branch. Empty phone prevents sending until
; a private local_config.h explicitly supplies a consenting test recipient.
[env:esp32dev_sms]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DENABLE_SMS=1
